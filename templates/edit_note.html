{% extends "base.html" %}

{% block title %}
Edit note
{% endblock %}

{% block content %}

<h1>Edit Note</h1>

<h2>{{ event[1] }}</h2>

<form method="POST" action="/watch/note/{{ event[0] }}">
    <textarea name="note">{{ event[2] }}</textarea>
    <button type="submit">Save Note</button>
</form>

{% endblock %}
